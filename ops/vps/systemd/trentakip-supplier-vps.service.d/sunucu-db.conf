# Deneme (K, 01.11): tedarikci ice aktarma YALNIZCA sunucu veritabanina yazar, Supabase kullanilmaz.
# keys.env: VPS_SUPABASE_URL / VPS_SERVICE_ROLE_KEY (sunucunun kendi PostgREST adresi ve anahtari)
[Service]
EnvironmentFile=/etc/trentakip/keys.env
Environment=TELEGRAM_BOT_TOKEN= TELEGRAM_CHAT_ID= SUPABASE_DB_URL=
ExecStart=
ExecStart=/bin/sh -c "SUPABASE_URL=$VPS_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY=$VPS_SERVICE_ROLE_KEY NODE_OPTIONS=--max-old-space-size=2500 exec /usr/bin/node --experimental-strip-types worker/import-xml.ts vps"
