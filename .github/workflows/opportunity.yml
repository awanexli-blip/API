name: Ürün seçimi (fırsat puanı)

# Tedarikçi ürünlerini pazaryeri için puanlar (kâr, stok, satış hızı...); hiçbir şey göndermez. Panel: Pazaryeri > Ürün seçimi.
on:
  schedule:
    - cron: "15 4 * * *"   # her gün 07:15 TR (satış hızı verisi gece birikir)
  push:
    paths: ["ops/opportunity.txt"]
  workflow_dispatch:
    inputs:
      supplier:
        description: "Tedarikçi kodu"
        default: "royal"
      marketplace:
        description: "Pazaryeri"
        default: "trendyol"

# En az yetki: depoya yazmaz (GitHub token yalnızca okuma)
permissions:
  contents: read

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: npm ci --prefix worker
      - name: Puanla
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          SUPABASE_URL: ${{ secrets.SUPABASE_URL2 }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY2 }}
          SUPPLIER: ${{ github.event.inputs.supplier || 'royal' }}
          MP: ${{ github.event.inputs.marketplace || 'trendyol' }}
        run: node --experimental-strip-types worker/opportunity.ts "$SUPPLIER" "$MP"
