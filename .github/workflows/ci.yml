name: CI

# Her push/PR'da: kilit dosyasıyla kurulum, tip kontrolü, derleme, testler (canlıya yazmaz)
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix worker --no-audit --no-fund
      - run: npx tsc --noEmit
      - name: Derleme (sahte genel anahtarlarla; sunucu anahtarı gerekmez)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
        run: npm run build
      - run: npm test
      - name: Bağımlılık güvenlik taraması (yüksek ve üstü)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
