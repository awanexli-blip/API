name: XML içe aktarma

on:
  # Her gece "gece içe aktar" işaretli tedarikçiler (panel: Ürünler -> Tedarikçiler)
  schedule:
    - cron: "40 2 * * *"   # 05:40 TR
  workflow_dispatch:
    inputs:
      supplier:
        description: "Tedarikçi kodu (all = hepsi)"
        default: "all"
      actor:
        description: "Başlatan (panelden gelir)"
        default: "elle"

concurrency:
  group: import-xml
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: npm ci --prefix worker
      - name: Test (sahte servislerle)
        run: node worker/test/run.mjs
      - name: XML -> ürünler
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          XML_URL: ${{ secrets.XML_URL }}   # BayilikXML (url_from_env); diğer tedarikçilerin adresi veritabanında
          ACTOR: ${{ github.event.inputs.actor || 'zamanlı' }}
          SUPPLIER: ${{ github.event.inputs.supplier || 'nightly' }}
        run: node --experimental-strip-types worker/import-xml.ts "$SUPPLIER"
