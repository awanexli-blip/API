# Sunucu (VPS) yenilendi mi: 10 dakikada bir dışarıdan SSH anahtarına bakar. Yeni kurulumda sunucunun anahtarı değişir (eski node 29.10'da
# yavaş ama açık olduğundan "açık mı" yetmiyordu). Değişince Telegram'a bir kez yazar ve kendini kapatır.
# Yeniden izlemek için: Actions -> "Sunucu izleme" -> Enable workflow. OLD_KEY: eski kurulumun ED25519 açık anahtarı (gizli değil).
name: Sunucu izleme

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/vps-watch.yml"]

permissions:
  actions: write   # yenilenince kendini kapatmak için
  contents: read

concurrency:
  group: vps-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HOST: 89.252.153.145
      OLD_KEY: AAAAC3NzaC1lZDI1NTE5AAAAIFCQZQyBfhDoc6GvDUDsqc/xSiPyYmYkT954HjqIQOTg
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Kontrol ve bildirim
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          send() {
            if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT:-}" ]; then echo "Telegram secret'ları yok"; return 0; fi
            curl -sS -m 20 "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" --data-urlencode "chat_id=${TG_CHAT}" --data-urlencode "text=$1" >/dev/null
          }
          key=$(timeout 60 ssh-keyscan -T 45 -t ed25519 "$HOST" 2>/dev/null | grep -v '^#' | awk '{print $3}' | head -1 || true)
          if [ -z "$key" ]; then state="cevap yok"; elif [ "$key" = "$OLD_KEY" ]; then state="eski kurulum"; else state="YENİ KURULUM"; fi
          echo "durum: $state"
          if [ "$EVENT" = "push" ]; then
            send "👀 Sunucu yenileme izleniyor (10 dakikada bir). Yeni kurulum açılınca buradan haber vereceğim. Şu an: $state"
            exit 0
          fi
          if [ "$state" = "YENİ KURULUM" ]; then
            send "✅ Sunucu yenilendi (89.252.153.145, yeni kurulum açıldı). Claude'a \"sunucu yenilendi\" yaz: hız kontrolü ve kurulum yapılacak."
            gh workflow disable vps-watch.yml && echo "izleme kapatıldı"
          fi
