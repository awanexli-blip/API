name: Trendyol sync

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # 15 dakikada bir (saat başı GitHub yoğun olduğu için :07'den), tüm pazaryerleri
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = sadece hesapla (yazmaz) · update = stok/fiyat gönder · create = yeni ürün aç · auto = update (+ayar açıksa create)"
        type: choice
        options: [preview, update, create, auto]
        default: "preview"
      limit:
        description: "Yeni ürün açmada en fazla kaç ürün (0 = sınırsız)"
        default: "50"
      marketplace:
        description: "Pazaryeri"
        type: choice
        options: [trendyol, hepsiburada, amazon]
        default: "trendyol"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Zamanlanmış çalışmada hepsi, elle tetiklemede seçilen pazaryeri.
        # Kimlik bilgisi tanımlı olmayan veya panelde kapalı pazaryeri kendiliğinden atlanır.
        # Zamanlı çalışmadaki pazaryerleri: GitHub Variable SYNC_MARKETPLACES (örn. ["trendyol","hepsiburada","amazon"]); boşsa Trendyol + Hepsiburada
        marketplace: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', github.event.inputs.marketplace) || vars.SYNC_MARKETPLACES || '["trendyol","hepsiburada"]') }}
    concurrency:
      group: sync-${{ matrix.marketplace }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --prefix worker
      - name: Test (sahte servislerle, canlıya yazmaz)
        run: node worker/test/run.mjs
      - name: Sync
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          XML_URL: ${{ secrets.XML_URL }}
          TRENDYOL_SELLER_ID: ${{ secrets.TRENDYOL_SELLER_ID }}
          TRENDYOL_API_KEY: ${{ secrets.TRENDYOL_API_KEY }}
          TRENDYOL_API_SECRET: ${{ secrets.TRENDYOL_API_SECRET }}
          TRENDYOL_STOREFRONT: ${{ vars.TRENDYOL_STOREFRONT }}
          TRENDYOL_BRAND_NAME: ${{ vars.TRENDYOL_BRAND_NAME }}
          TRENDYOL_SHIPMENT_ADDRESS_ID: ${{ secrets.TRENDYOL_SHIPMENT_ADDRESS_ID }}
          TRENDYOL_RETURN_ADDRESS_ID: ${{ secrets.TRENDYOL_RETURN_ADDRESS_ID }}
          CREATE_LIMIT: ${{ github.event.inputs.limit || '100' }}   # zamanlı çalışmada en fazla 100 yeni ürün
          HB_MERCHANT_ID: ${{ secrets.HB_MERCHANT_ID }}
          HB_USERNAME: ${{ secrets.HB_USERNAME }}
          HB_PASSWORD: ${{ secrets.HB_PASSWORD }}
          HB_ENV: ${{ vars.HB_ENV }}             # boş = test (SIT), "prod" = canlı
          HB_USER_AGENT: ${{ vars.HB_USER_AGENT || secrets.HB_USER_AGENT }}
          AMAZON_LWA_CLIENT_ID: ${{ secrets.AMAZON_LWA_CLIENT_ID }}
          AMAZON_LWA_CLIENT_SECRET: ${{ secrets.AMAZON_LWA_CLIENT_SECRET }}
          AMAZON_REFRESH_TOKEN: ${{ secrets.AMAZON_REFRESH_TOKEN }}
          AMAZON_SELLER_ID: ${{ secrets.AMAZON_SELLER_ID }}
        run: node --experimental-strip-types worker/sync.ts "${{ github.event.inputs.mode || 'auto' }}" "${{ matrix.marketplace }}"
      - name: İş kuyruğu (Faz 3)
        if: always() && matrix.marketplace == 'trendyol'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node --experimental-strip-types worker/jobs.ts 240
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.marketplace == 'trendyol' && 'preview-csv' || format('preview-{0}', matrix.marketplace) }}
          path: |
            preview*.csv
            xml_dump.csv
          if-no-files-found: ignore
          retention-days: 7
