# Telegram web kancası tanısı (salt okunur): getWebhookInfo -> adres, bekleyen güncelleme, son hata. Anahtar yazdırılmaz.
# Sonuç iş akışı notlarında (annotation). Elle: Actions -> "Telegram tanı" -> Run workflow.
name: Telegram tanı

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/telegram-check.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: getWebhookInfo
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "${TG_TOKEN:-}" ]; then echo "::error::TELEGRAM_BOT_TOKEN secret yok"; exit 1; fi
          j=$(curl -sS -m 20 "https://api.telegram.org/bot${TG_TOKEN}/getWebhookInfo")
          echo "$j" | jq -r '.result | "url=\(.url // "-") | bekleyen=\(.pending_update_count // 0) | son_hata=\(if .last_error_date then (.last_error_date|todate) else "-" end) \(.last_error_message // "") | izinli=\(.allowed_updates // [] | join(","))"' > info.txt
          echo "::notice title=Telegram web kancası::$(cat info.txt)"
