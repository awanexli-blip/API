name: Marka listesi

on:
  schedule:
    - cron: "15 3 * * 1"   # haftada bir (pazartesi 06:15 TR)
  workflow_dispatch:
    inputs:
      marketplace:
        description: "Pazaryeri"
        type: choice
        options: [trendyol]
        default: "trendyol"

jobs:
  brands:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: npm ci --prefix worker
      - name: Marka listesini çek
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRENDYOL_SELLER_ID: ${{ secrets.TRENDYOL_SELLER_ID }}
          TRENDYOL_API_KEY: ${{ secrets.TRENDYOL_API_KEY }}
          TRENDYOL_API_SECRET: ${{ secrets.TRENDYOL_API_SECRET }}
          TRENDYOL_STOREFRONT: ${{ vars.TRENDYOL_STOREFRONT }}
          MP: ${{ github.event.inputs.marketplace || 'trendyol' }}
        run: node --experimental-strip-types worker/brands.ts "$MP"
