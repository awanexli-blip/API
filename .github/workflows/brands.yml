name: Marka listesi

on:
  schedule:
    - cron: "15 3 * * 1"   # haftada bir (pazartesi 06:15 TR)
  workflow_dispatch:
    inputs:
      marketplace:
        description: "Pazaryeri"
        type: choice
        options: [trendyol]
        default: "trendyol"

jobs:
  brands:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix worker
      - name: Marka listesini çek
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRENDYOL_SELLER_ID: ${{ secrets.TRENDYOL_SELLER_ID }}
          TRENDYOL_API_KEY: ${{ secrets.TRENDYOL_API_KEY }}
          TRENDYOL_API_SECRET: ${{ secrets.TRENDYOL_API_SECRET }}
          TRENDYOL_STOREFRONT: ${{ vars.TRENDYOL_STOREFRONT }}
        run: node --experimental-strip-types worker/brands.ts "${{ github.event.inputs.marketplace || 'trendyol' }}"
