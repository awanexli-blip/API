name: Marka listesi

on:
  # Zamanlı çalışma kapalı (K, 25.10: veritabanı ücretsiz planda kalsın; liste 807 bin satır / ~200 MB, ürünler tedarikçi markasıyla açılıyor).
  # Elle ürün eklerken marka önerisi gerekirse Actions'tan elle çalıştırılır.
  workflow_dispatch:
    inputs:
      marketplace:
        description: "Pazaryeri"
        type: choice
        options: [trendyol]
        default: "trendyol"

# En az yetki: depoya yazmaz (GitHub token yalnızca okuma)
permissions:
  contents: read

jobs:
  brands:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: npm ci --prefix worker
      - name: Marka listesini çek
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL2 }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY2 }}
          TRENDYOL_SELLER_ID: ${{ secrets.TRENDYOL_SELLER_ID }}
          TRENDYOL_API_KEY: ${{ secrets.TRENDYOL_API_KEY }}
          TRENDYOL_API_SECRET: ${{ secrets.TRENDYOL_API_SECRET }}
          TRENDYOL_STOREFRONT: ${{ vars.TRENDYOL_STOREFRONT }}
          MP: ${{ github.event.inputs.marketplace || 'trendyol' }}
        run: node --experimental-strip-types worker/brands.ts "$MP"
