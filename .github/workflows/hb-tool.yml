name: Hepsiburada test aracı

# Hepsiburada entegrasyon testi ve canlıya geçiş için elle çalıştırılan komutlar.
# Ayrıntı: worker/hb-tool.ts ve docs/HEPSIBURADA_TEST.md

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Komut"
        type: choice
        options: [ping, categories, suggest, attributes, send, status, listings, stock, price, orders, raw]
        default: ping
      args:
        description: "Argümanlar (örn. send için: 1 18021982 mutfak · attributes için: 18021982 · stock için: OS13-XXX 10)"
        default: ""
      env:
        description: "Ortam"
        type: choice
        options: [sit, prod]
        default: sit

# En az yetki: depoya yazmaz (GitHub token yalnızca okuma)
permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: sync-hepsiburada
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: npm ci --prefix worker
      - name: Çalıştır
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL2 }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY2 }}
          XML_URL: ${{ secrets.XML_URL }}
          HB_MERCHANT_ID: ${{ secrets.HB_MERCHANT_ID }}
          HB_USERNAME: ${{ secrets.HB_USERNAME }}
          HB_PASSWORD: ${{ secrets.HB_PASSWORD }}
          HB_USER_AGENT: ${{ vars.HB_USER_AGENT || secrets.HB_USER_AGENT }}
          HB_ENV: ${{ github.event.inputs.env == 'prod' && 'prod' || '' }}
          CMD: ${{ github.event.inputs.command }}
          ARGS: ${{ github.event.inputs.args }}   # ortam değişkeniyle: kabuk komutu olarak yorumlanmaz
        run: node --experimental-strip-types worker/hb-tool.ts "$CMD" $ARGS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: hb-tool-${{ github.event.inputs.command }}
          path: |
            hb_tool_output.json
            hb_categories.csv
            hb_category_suggestions.csv
          if-no-files-found: ignore
          retention-days: 1
