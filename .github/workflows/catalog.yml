name: Pazaryeri kataloğu

# Ürün formu için pazaryeri kategori ağaçları ve kategori özellikleri (worker/catalog.ts). Panel bir kategorinin özelliklerini istediğinde
# kuyruğa yazar ve bu iş akışını başlatır (Hepsiburada anahtarları yalnızca burada). Ayrıca her gün ağaçları tazeler.
on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"
  push:
    paths: ["ops/catalog.txt"]

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: npm ci --prefix worker
      - name: Katalog
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL2 }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY2 }}
          HB_MERCHANT_ID: ${{ secrets.HB_MERCHANT_ID }}
          HB_USERNAME: ${{ secrets.HB_USERNAME }}
          HB_PASSWORD: ${{ secrets.HB_PASSWORD }}
          HB_ENV: ${{ vars.HB_ENV }}
          HB_USER_AGENT: ${{ vars.HB_USER_AGENT || secrets.HB_USER_AGENT }}
        run: node --experimental-strip-types worker/catalog.ts
